# Prompt shared by zsh (macOS) and PowerShell (Windows):
#   14:32 dev-kit/plugins/core main ↓2 ↑1 +1 ~2 -1 ?3 !1 1 %
# time, folder (from the repository root, ~ outside one), branch or detached
# hash, behind/ahead or ✓ when up to date, non-zero counters (staged, modified,
# deleted, untracked, conflicted), exit code of a failed command.

add_newline = false
format = "$time$directory$git_branch$git_commit$git_status$status$character"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "
style = "bright-black"

[directory]
truncate_to_repo = true
truncation_length = 100
truncation_symbol = ""
use_os_path_sep = false  # / on Windows too
repo_root_format = "[$repo_root$path]($style) "
format = "[$path]($style) "
style = "cyan"

[git_branch]
only_attached = true
format = "[$branch]($style) "
style = "purple"

[git_commit]
only_detached = true
tag_disabled = true
format = "[$hash]($style) "
style = "purple"

[git_status]
format = "([$ahead_behind$staged$modified$deleted$untracked$conflicted]($style) )"
style = "yellow"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↓${behind_count} ↑${ahead_count}"
up_to_date = "✓"
staged = " +${count}"
modified = " ~${count}"
deleted = " -${count}"
untracked = " ?${count}"
conflicted = " !${count}"
stashed = ""
renamed = ""
typechanged = ""

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[character]
success_symbol = "%"
error_symbol = "%"
